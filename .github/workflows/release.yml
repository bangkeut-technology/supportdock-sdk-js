name: Release to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11.x natively (Trusted Publishing/OIDC needs >= 11.5.1).
      #
      # NO `registry-url`: setup-node's registry-url makes it inject a placeholder
      # NODE_AUTH_TOKEN (XXXXX-XXXXX-XXXXX-XXXXX) into an .npmrc, so npm finds a
      # (garbage) token and takes the classic-auth path instead of OIDC. Without
      # it, npm 11.x finds no token and uses Trusted Publishing against the
      # default registry (registry.npmjs.org).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Diagnostic: confirm npm is actually >= 11.5.1 at publish time.
      - name: Tool versions
        run: |
          node -v
          npm -v

      - run: npm install
      - run: npm run build

      - run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
