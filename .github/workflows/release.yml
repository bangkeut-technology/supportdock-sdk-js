name: Release to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11.x natively (Trusted Publishing/OIDC needs >= 11.5.1),
      # so OIDC support doesn't hinge on the global upgrade below landing.
      # registry-url is kept per npm's official example — it scopes the registry
      # for the OIDC token exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      # Diagnostic: confirm npm is actually >= 11.5.1 at publish time.
      - name: Tool versions
        run: |
          node -v
          npm -v

      - run: npm install
      - run: npm run build

      - run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
