name: Release to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC auth) requires npm >= 11.5.1; the npm bundled
      # with Node is older and can only sign provenance, not authenticate the
      # publish — which fails the PUT with a 404.
      - run: npm install -g npm@latest

      - run: npm install
      - run: npm run build

      - run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
