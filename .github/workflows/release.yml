name: Release to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # for --provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install
      - run: npm run build

      # Token auth. We tried OIDC Trusted Publishing but the registry rejects the
      # token exchange for this scoped package with "package not found" (npm bug
      # npm/cli#8678 — scoped package with an existing published version). Switch
      # back to OIDC by removing the env block once that's fixed upstream.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
